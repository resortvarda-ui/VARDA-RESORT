  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#gold)"/>
  <!-- Elegant Silhouette -->
  <circle cx="300" cy="320" r="110" fill="#1f1f1f" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.2"/>
  <path d="M 120 750 Q 300 480 480 750 L 480 800 L 120 800 Z" fill="#1f1f1f" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.2"/>
